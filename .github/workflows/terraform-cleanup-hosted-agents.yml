name: Terraform Cleanup - Hosted Agents

# GitHub Actions workflow for cleaning up Terraform infrastructure
# Runs daily at 9 PM UTC to prevent cost accumulation from forgotten resources

on:
  schedule:
    - cron: '0 21 * * *'  # Runs daily at 9 PM UTC
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to clean up (dev, staging, prod)'
        required: true
        default: 'dev'
        type: choice
        options:
        - dev
        - staging
        - prod

# WARNING: This workflow will destroy all resources in the specified environment
# It runs automatically daily to prevent cost accumulation
# Make sure you have proper state backup before using this

env:
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
  TF_STATE_RESOURCE_GROUP: ${{ secrets.TF_STATE_RESOURCE_GROUP }}
  TF_STATE_STORAGE_ACCOUNT: ${{ secrets.TF_STATE_STORAGE_ACCOUNT }}
  TF_STATE_CONTAINER: ${{ secrets.TF_STATE_CONTAINER }}
  TF_STATE_KEY: "hosted-agents-${{ github.event.inputs.environment || 'dev' }}.tfstate"

jobs:
  terraform-destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: "1.5.7"

    - name: Configure Azure CLI with OIDC
      uses: azure/login@v3
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Terraform Init
      id: init
      run: |
        cd labs/hosted-agents/terraform
        terraform init \
          -backend-config="resource_group_name=$TF_STATE_RESOURCE_GROUP" \
          -backend-config="storage_account_name=$TF_STATE_STORAGE_ACCOUNT" \
          -backend-config="container_name=$TF_STATE_CONTAINER" \
          -backend-config="key=$TF_STATE_KEY"

    - name: Terraform Destroy
      id: destroy
      run: |
        cd labs/hosted-agents/terraform
        terraform destroy -auto-approve -input=false -var="environment=${{ github.event.inputs.environment || 'dev' }}"