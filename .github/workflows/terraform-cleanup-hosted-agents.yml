name: Terraform Cleanup - Hosted Agents

# GitHub Actions workflow for cleaning up Terraform infrastructure
# Runs daily at 9 PM UTC to prevent cost accumulation from forgotten resources

on:
  schedule:
    - cron: '0 21 * * *'  # Runs daily at 9 PM UTC
  workflow_dispatch:

# WARNING: This workflow destroys the lab resources.
# It runs automatically daily to prevent cost accumulation.

env:
  TF_STATE_RESOURCE_GROUP: ${{ secrets.TF_STATE_RESOURCE_GROUP }}
  TF_STATE_STORAGE_ACCOUNT: ${{ secrets.TF_STATE_STORAGE_ACCOUNT }}
  TF_STATE_CONTAINER: ${{ secrets.TF_STATE_CONTAINER }}
  TF_STATE_KEY: "hosted-agents-dev.tfstate"
  ARM_CLIENT_ID: "${{ secrets.AZURE_CLIENT_ID }}"
  ARM_SUBSCRIPTION_ID: "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
  ARM_TENANT_ID: "${{ secrets.AZURE_TENANT_ID }}"
  ARM_USE_AZUREAD: true
  ARM_USE_OIDC: true

jobs:
  terraform-destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.5.7"

    - name: Configure Azure CLI with OIDC
      uses: azure/login@v3
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        
    - name: Terraform Init
      id: init
      run: |
        cd labs/hosted-agents/terraform
        terraform init \
          -backend-config="resource_group_name=$TF_STATE_RESOURCE_GROUP" \
          -backend-config="storage_account_name=$TF_STATE_STORAGE_ACCOUNT" \
          -backend-config="container_name=$TF_STATE_CONTAINER" \
          -backend-config="key=$TF_STATE_KEY"

    - name: Terraform Destroy
      id: destroy
      run: |
        set -euo pipefail
        cd labs/hosted-agents/terraform
        terraform destroy -auto-approve -input=false

    - name: Purge soft-deleted Foundry account
      if: success() || failure()
      run: |
        set -euo pipefail
        chmod +x labs/hosted-agents/terraform/scripts/purge-soft-deleted-foundry.sh
        labs/hosted-agents/terraform/scripts/purge-soft-deleted-foundry.sh \
          westeurope \
          "rg-hosted-agents-dev-weu" \
          "cog-hosted-agents-dev-weu"
