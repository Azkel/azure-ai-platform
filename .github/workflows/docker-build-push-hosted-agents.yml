name: Docker Build, Push and Deploy - Hosted Agents

# GitHub Actions workflow for building, pushing Docker image to Azure Container Registry,
# and deploying the HelloWorld hosted agent sample at enterprise scale.
#
# Architecture:
# - Infrastructure: Terraform-managed (ACR, Key Vault, Foundry account + project)
# - CI/CD: GitHub Actions with dedicated runners (not local developer machines)
# - Deployment: Azure Developer CLI (azd) for agent deployment to Foundry
#
# Prerequisites:
# - Terraform infrastructure must be deployed first (ACR, Foundry project)
# - GitHub OIDC configured for Azure authentication
# - Service principal with appropriate RBAC roles
#
# References:
# - https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/set-up-ci-cd-cli
# - https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/deploy-hosted-agent-private-azure-container-registry

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to (dev, staging, prod)'
        required: true
        default: 'dev'
        type: choice
        options:
        - dev
        - staging
        - prod
      skip-deploy:
        description: 'Skip hosted agent deployment (build and push only)'
        required: false
        default: 'false'
        type: boolean
      deploy-only:
        description: 'Skip build and only deploy existing image (uses latest tag)'
        required: false
        default: 'false'
        type: boolean

env:
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_LOCATION: "polandcentral"
  AGENT_NAME: "hello-world-dotnet-responses"
  FOUNDRY_PROJECT_NAME: "hosted-agents-project"

jobs:
  validate-infra:
    name: Validate Infrastructure
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
    permissions:
      id-token: write
      contents: read
    outputs:
      acr_exists: ${{ steps.check-acr.outputs.acr_exists }}
      acr_name: ${{ steps.check-acr.outputs.acr_name }}
      foundry_project_endpoint: ${{ steps.get-endpoint.outputs.foundry_project_endpoint }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure Azure CLI with OIDC
      uses: azure/login@v3
      with:
        client-id: ${{ env.AZURE_CLIENT_ID }}
        tenant-id: ${{ env.AZURE_TENANT_ID }}
        subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

    - name: Check if Azure Container Registry exists
      id: check-acr
      run: |
        # Construct the full ACR name based on the pattern in Terraform
        # Pattern: acr{workload_no_hyphens}{environment}plc (e.g., acrhostedagentsdevplc)
        # ACR names can only contain alphanumeric characters
        FULL_ACR_NAME="acrhostedagents${{ github.event.inputs.environment }}plc"
        echo "Checking if ACR exists: $FULL_ACR_NAME"
        
        if az acr show --name "$FULL_ACR_NAME" --output none 2>/dev/null; then
          echo "ACR exists: $FULL_ACR_NAME"
          echo "acr_exists=true" >> $GITHUB_OUTPUT
          echo "acr_name=$FULL_ACR_NAME" >> $GITHUB_OUTPUT
        else
          echo "::error::Azure Container Registry '$FULL_ACR_NAME' does not exist."
          echo "Please run the 'Terraform Deploy - Hosted Agents' workflow first to create the infrastructure."
          echo "acr_exists=false" >> $GITHUB_OUTPUT
          exit 1
        fi

    - name: Get Foundry project endpoint
      id: get-endpoint
      run: |
        # Calculate Foundry project endpoint from Terraform naming convention
        # Foundry account: cog-{workload}-{environment}-plc
        # Project endpoint: https://cog-{workload}-{environment}-plc.services.ai.azure.com/api/projects/{project_name}
        ENVIRONMENT="${{ github.event.inputs.environment || 'dev' }}"
        FOUNDRY_ACCOUNT_NAME="cog-hosted-agents-$ENVIRONMENT-plc"
        FOUNDRY_PROJECT_ENDPOINT="https://${FOUNDRY_ACCOUNT_NAME}.services.ai.azure.com/api/projects/${{ env.FOUNDRY_PROJECT_NAME }}"
        echo "foundry_project_endpoint=$FOUNDRY_PROJECT_ENDPOINT" >> $GITHUB_OUTPUT

  build-and-deploy:
    name: Build, Push and Deploy
    needs: validate-infra
    if: needs.validate-infra.outputs.acr_exists == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
    permissions:
      id-token: write
      contents: read
      packages: write


    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure Azure CLI with OIDC
      uses: azure/login@v3
      with:
        client-id: ${{ env.AZURE_CLIENT_ID }}
        tenant-id: ${{ env.AZURE_TENANT_ID }}
        subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

    - name: Install Azure Developer CLI
      uses: Azure/setup-azd@v2

    - name: Install Foundry extensions
      run: azd ext install microsoft.foundry --no-prompt

    - name: Authenticate Azure Developer CLI
      run: |
        azd auth login \
          --client-id ${{ env.AZURE_CLIENT_ID }} \
          --federated-credential-provider github \
          --tenant-id ${{ env.AZURE_TENANT_ID }} \
          --no-prompt

    - name: Set Foundry project context
      working-directory: labs/hosted-agents/src
      run: |
        set -euo pipefail
        ENVIRONMENT="${{ github.event.inputs.environment || 'dev' }}"
        FOUNDRY_ENDPOINT="${{ needs.validate-infra.outputs.foundry_project_endpoint }}"

        # azure.yaml is the azd project; it is checked in. The .azure/ env
        # directory is gitignored, so first (and cleaned) CI runs must create it.
        if [ ! -f azure.yaml ]; then
          echo "::error::azd project not found: azure.yaml is missing in labs/hosted-agents/src"
          exit 1
        fi

        if [ -d ".azure/${ENVIRONMENT}" ]; then
          echo "azd environment '${ENVIRONMENT}' already exists — selecting it"
          azd env select "${ENVIRONMENT}" --no-prompt
        else
          echo "azd environment '${ENVIRONMENT}' not found — creating it"
          azd env new "${ENVIRONMENT}" \
            --location "${{ env.AZURE_LOCATION }}" \
            --subscription "${{ env.AZURE_SUBSCRIPTION_ID }}" \
            --no-prompt
        fi

        echo "Setting Foundry project endpoint: $FOUNDRY_ENDPOINT"
        azd ai project set "$FOUNDRY_ENDPOINT" --no-prompt

        PROJECT_ID="/subscriptions/${{ env.AZURE_SUBSCRIPTION_ID }}/resourceGroups/rg-hosted-agents-${ENVIRONMENT}-plc/providers/Microsoft.CognitiveServices/accounts/cog-hosted-agents-${ENVIRONMENT}-plc/projects/${{ env.FOUNDRY_PROJECT_NAME }}"
        azd env set AZURE_LOCATION "${{ env.AZURE_LOCATION }}" --no-prompt
        azd env set AZURE_AI_PROJECT_ID "${PROJECT_ID}" --no-prompt
        # Also set as GitHub Actions environment variables to ensure they're available
        echo "AZURE_LOCATION=${{ env.AZURE_LOCATION }}" >> $GITHUB_ENV
        echo "AZURE_AI_PROJECT_ID=${PROJECT_ID}" >> $GITHUB_ENV
        azd env get-values

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Azure Container Registry
      run: |
        az acr login --name ${{ needs.validate-infra.outputs.acr_name }} --output none

    - name: Extract metadata for Docker image
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ needs.validate-infra.outputs.acr_name }}.azurecr.io/${{ env.AGENT_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=tag
          type=sha
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      if: github.event.inputs.deploy-only == 'false'
      uses: docker/build-push-action@v5
      id: build-push
      with:
        context: labs/hosted-agents/src/src/hello-world-dotnet-responses
        file: labs/hosted-agents/src/src/hello-world-dotnet-responses/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    - name: Get image tag
      if: steps.build-push.outcome == 'success' || github.event.inputs.deploy-only == 'true'
      id: get-tag
      run: |
        # If we built, use the first tag; if deploy-only, use 'latest'
        if [ "${{ github.event.inputs.deploy-only }}" = "true" ]; then
          TAG="latest"
        else
          TAGS="${{ steps.meta.outputs.tags }}"
          IFS=',' read -ra TAG_ARRAY <<< "$TAGS"
          LAST_TAG=${TAG_ARRAY[0]}
          TAG=${LAST_TAG#*:}
        fi
        echo "Using tag: $TAG"
        echo "tag=$TAG" >> $GITHUB_OUTPUT

    - name: Deploy hosted agent
      if: github.event.inputs.skip-deploy == 'false'
      id: deploy-agent
      working-directory: labs/hosted-agents/src
      env:
        IMAGE_REF: ${{ needs.validate-infra.outputs.acr_name }}.azurecr.io/${{ env.AGENT_NAME }}:${{ steps.get-tag.outputs.tag }}
        AZURE_ENV_NAME: ${{ github.event.inputs.environment || 'dev' }}
      run: |
        set -euo pipefail
        echo "Deploying image: $IMAGE_REF"

        # Modify azure.yaml to use pre-built image for container deploy
        cp azure.yaml azure.yaml.bak
        pip install pyyaml -q 2>/dev/null || true
        python3 << EOF
import yaml
import os

with open('azure.yaml', 'r') as f:
    data = yaml.safe_load(f)

svc = data['services']['hello-world-dotnet-responses']
svc['language'] = 'docker'
svc['image'] = os.environ['IMAGE_REF']
# Remove source-based fields
for key in ['project', 'codeConfiguration', 'docker']:
    if key in svc:
        del svc[key]

with open('azure.yaml', 'w') as f:
    yaml.dump(data, f, sort_keys=False)
EOF

        # Deploy using azd deploy which will use the image from azure.yaml
        azd deploy hello-world-dotnet-responses -e "$AZURE_ENV_NAME" --no-prompt --output json
