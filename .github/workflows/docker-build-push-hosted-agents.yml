name: Docker Build, Push and Deploy - Hosted Agents

# GitHub Actions workflow for building, pushing the sample agent image to ACR,
# and deploying it to Azure AI Foundry Hosted Agents.
#
# Architecture:
# - Infrastructure: Terraform-managed (ACR, Storage, Key Vault, Foundry account + project)
# - CI/CD: GitHub Actions with OIDC
# - Deployment: Azure Developer CLI (azd) for agent deployment to Foundry
# - Post-deploy: grant agent instance identity Storage Blob Data Contributor + Key Vault Secrets User
#
# Prerequisites:
# - Terraform infrastructure must be deployed first (ACR, Foundry project)
# - GitHub OIDC configured for Azure authentication
#
# References:
# - https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/set-up-ci-cd-cli
# - https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/deploy-hosted-agent-private-azure-container-registry

on:
  workflow_dispatch:
    inputs:
      skip-deploy:
        description: 'Skip hosted agent deployment (build and push only)'
        required: false
        default: 'false'
        type: boolean
      deploy-only:
        description: 'Skip build and only deploy existing image (uses latest tag)'
        required: false
        default: 'false'
        type: boolean

env:
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_LOCATION: "westeurope"
  LOCATION_SHORT: "weu"
  LAB_ENVIRONMENT: "dev"
  AGENT_NAME: "storage-kv-agent"
  FOUNDRY_PROJECT_NAME: "hosted-agents-project"

jobs:
  validate-infra:
    name: Validate Infrastructure
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    outputs:
      acr_exists: ${{ steps.check-acr.outputs.acr_exists }}
      acr_name: ${{ steps.check-acr.outputs.acr_name }}
      foundry_project_endpoint: ${{ steps.get-endpoint.outputs.foundry_project_endpoint }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure Azure CLI with OIDC
      uses: azure/login@v3
      with:
        client-id: ${{ env.AZURE_CLIENT_ID }}
        tenant-id: ${{ env.AZURE_TENANT_ID }}
        subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

    - name: Check if Azure Container Registry exists
      id: check-acr
      run: |
        # Pattern: acr{workload_no_hyphens}{environment}{location_short} (e.g., acrhostedagentsdevweu)
        FULL_ACR_NAME="acrhostedagents${{ env.LAB_ENVIRONMENT }}${{ env.LOCATION_SHORT }}"
        echo "Checking if ACR exists: $FULL_ACR_NAME"
        
        if az acr show --name "$FULL_ACR_NAME" --output none 2>/dev/null; then
          echo "ACR exists: $FULL_ACR_NAME"
          echo "acr_exists=true" >> $GITHUB_OUTPUT
          echo "acr_name=$FULL_ACR_NAME" >> $GITHUB_OUTPUT
        else
          echo "::error::Azure Container Registry '$FULL_ACR_NAME' does not exist."
          echo "Please run the 'Terraform Deploy - Hosted Agents' workflow first to create the infrastructure."
          echo "acr_exists=false" >> $GITHUB_OUTPUT
          exit 1
        fi

    - name: Get Foundry project endpoint
      id: get-endpoint
      run: |
        set -euo pipefail
        # Resource name is cog-{workload}-{env}-{region}, but the DNS hostname
        # uses custom_subdomain_name = {workload}-{env}-{region} (no cog- prefix).
        RG_NAME="rg-hosted-agents-${{ env.LAB_ENVIRONMENT }}-${{ env.LOCATION_SHORT }}"
        FOUNDRY_ACCOUNT_NAME="cog-hosted-agents-${{ env.LAB_ENVIRONMENT }}-${{ env.LOCATION_SHORT }}"

        echo "Looking up Foundry account: $FOUNDRY_ACCOUNT_NAME in $RG_NAME"
        if ! az cognitiveservices account show \
          --name "$FOUNDRY_ACCOUNT_NAME" \
          --resource-group "$RG_NAME" \
          --output none 2>/dev/null; then
          echo "::error::Foundry account '$FOUNDRY_ACCOUNT_NAME' not found in '$RG_NAME'."
          echo "Please run the 'Terraform Deploy - Hosted Agents' workflow first."
          exit 1
        fi

        SUBDOMAIN=$(az cognitiveservices account show \
          --name "$FOUNDRY_ACCOUNT_NAME" \
          --resource-group "$RG_NAME" \
          --query properties.customSubDomainName -o tsv)
        ACCOUNT_ENDPOINT=$(az cognitiveservices account show \
          --name "$FOUNDRY_ACCOUNT_NAME" \
          --resource-group "$RG_NAME" \
          --query properties.endpoint -o tsv)

        if [ -z "$SUBDOMAIN" ] || [ "$SUBDOMAIN" = "None" ]; then
          echo "::error::Foundry account has no customSubDomainName"
          exit 1
        fi

        # azd / Foundry agent APIs use services.ai.azure.com/api/projects/{name}
        FOUNDRY_PROJECT_ENDPOINT="https://${SUBDOMAIN}.services.ai.azure.com/api/projects/${{ env.FOUNDRY_PROJECT_NAME }}"
        echo "Account endpoint: $ACCOUNT_ENDPOINT"
        echo "Custom subdomain: $SUBDOMAIN"
        echo "Project endpoint: $FOUNDRY_PROJECT_ENDPOINT"
        echo "foundry_project_endpoint=$FOUNDRY_PROJECT_ENDPOINT" >> "$GITHUB_OUTPUT"

  build-and-deploy:
    name: Build, Push and Deploy
    needs: validate-infra
    if: needs.validate-infra.outputs.acr_exists == 'true'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
      packages: write


    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure Azure CLI with OIDC
      uses: azure/login@v3
      with:
        client-id: ${{ env.AZURE_CLIENT_ID }}
        tenant-id: ${{ env.AZURE_TENANT_ID }}
        subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

    - name: Install Azure Developer CLI
      uses: Azure/setup-azd@v2

    - name: Install Foundry extensions
      run: azd ext install microsoft.foundry --no-prompt

    - name: Authenticate Azure Developer CLI
      run: |
        azd auth login \
          --client-id ${{ env.AZURE_CLIENT_ID }} \
          --federated-credential-provider github \
          --tenant-id ${{ env.AZURE_TENANT_ID }} \
          --no-prompt

    - name: Set Foundry project context
      working-directory: labs/hosted-agents/src
      run: |
        set -euo pipefail
        ENVIRONMENT="${{ env.LAB_ENVIRONMENT }}"
        FOUNDRY_ENDPOINT="${{ needs.validate-infra.outputs.foundry_project_endpoint }}"

        # azure.yaml is the azd project; it is checked in. The .azure/ env
        # directory is gitignored, so first (and cleaned) CI runs must create it.
        if [ ! -f azure.yaml ]; then
          echo "::error::azd project not found: azure.yaml is missing in labs/hosted-agents/src"
          exit 1
        fi

        if [ -d ".azure/${ENVIRONMENT}" ]; then
          echo "azd environment '${ENVIRONMENT}' already exists - selecting it"
          azd env select "${ENVIRONMENT}" --no-prompt
        else
          echo "azd environment '${ENVIRONMENT}' not found - creating it"
          azd env new "${ENVIRONMENT}" \
            --location "${{ env.AZURE_LOCATION }}" \
            --subscription "${{ env.AZURE_SUBSCRIPTION_ID }}" \
            --no-prompt
        fi

        echo "Setting Foundry project endpoint: $FOUNDRY_ENDPOINT"
        azd ai project set "$FOUNDRY_ENDPOINT" --no-prompt

        PROJECT_ID="/subscriptions/${{ env.AZURE_SUBSCRIPTION_ID }}/resourceGroups/rg-hosted-agents-${ENVIRONMENT}-${{ env.LOCATION_SHORT }}/providers/Microsoft.CognitiveServices/accounts/cog-hosted-agents-${ENVIRONMENT}-${{ env.LOCATION_SHORT }}/projects/${{ env.FOUNDRY_PROJECT_NAME }}"
        STORAGE_ACCOUNT_NAME="sthostedagents${ENVIRONMENT}${{ env.LOCATION_SHORT }}"
        KEY_VAULT_NAME="kv-hosted-agents-${ENVIRONMENT}-${{ env.LOCATION_SHORT }}"
        KEY_VAULT_URI="https://${KEY_VAULT_NAME}.vault.azure.net/"

        # azd deploy reads these from the active azd environment (.azure/<env>/.env),
        # not from global config alone — FOUNDRY_PROJECT_ENDPOINT is required.
        azd env set AZURE_LOCATION "${{ env.AZURE_LOCATION }}" --no-prompt
        azd env set AZURE_AI_PROJECT_ID "${PROJECT_ID}" --no-prompt
        azd env set FOUNDRY_PROJECT_ENDPOINT "$FOUNDRY_ENDPOINT" --no-prompt
        azd env set FOUNDRY_PROJECT_ARM_ID "${PROJECT_ID}" --no-prompt
        azd env set AZURE_AI_MODEL_DEPLOYMENT_NAME "gpt-5-mini" --no-prompt
        azd env set AZURE_STORAGE_ACCOUNT_NAME "$STORAGE_ACCOUNT_NAME" --no-prompt
        azd env set AZURE_STORAGE_CONTAINER_NAME "agent-notes" --no-prompt
        azd env set AZURE_KEY_VAULT_URI "$KEY_VAULT_URI" --no-prompt
        azd env set AZURE_KEY_VAULT_SECRET_NAME "agent-demo-message" --no-prompt

        echo "AZURE_LOCATION=${{ env.AZURE_LOCATION }}" >> $GITHUB_ENV
        echo "AZURE_AI_PROJECT_ID=${PROJECT_ID}" >> $GITHUB_ENV
        echo "FOUNDRY_PROJECT_ENDPOINT=$FOUNDRY_ENDPOINT" >> $GITHUB_ENV
        echo "AZURE_STORAGE_ACCOUNT_NAME=$STORAGE_ACCOUNT_NAME" >> $GITHUB_ENV
        echo "AZURE_KEY_VAULT_URI=$KEY_VAULT_URI" >> $GITHUB_ENV
        azd env get-values

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Azure Container Registry
      run: |
        az acr login --name ${{ needs.validate-infra.outputs.acr_name }} --output none

    - name: Extract metadata for Docker image
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ needs.validate-infra.outputs.acr_name }}.azurecr.io/${{ env.AGENT_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=tag
          type=sha
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      if: github.event.inputs.deploy-only == 'false'
      uses: docker/build-push-action@v5
      id: build-push
      with:
        context: labs/hosted-agents/src/storage-kv-agent
        file: labs/hosted-agents/src/storage-kv-agent/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    - name: Get image tag
      if: steps.build-push.outcome == 'success' || github.event.inputs.deploy-only == 'true'
      id: get-tag
      run: |
        # If we built, use the first tag; if deploy-only, use 'latest'
        if [ "${{ github.event.inputs.deploy-only }}" = "true" ]; then
          TAG="latest"
        else
          TAGS="${{ steps.meta.outputs.tags }}"
          IFS=',' read -ra TAG_ARRAY <<< "$TAGS"
          LAST_TAG=${TAG_ARRAY[0]}
          TAG=${LAST_TAG#*:}
        fi
        echo "Using tag: $TAG"
        echo "tag=$TAG" >> $GITHUB_OUTPUT

    - name: Deploy hosted agent
      if: github.event.inputs.skip-deploy == 'false'
      id: deploy-agent
      working-directory: labs/hosted-agents/src
      env:
        IMAGE_REF: ${{ needs.validate-infra.outputs.acr_name }}.azurecr.io/${{ env.AGENT_NAME }}:${{ steps.get-tag.outputs.tag }}
        AZURE_ENV_NAME: ${{ env.LAB_ENVIRONMENT }}
        FOUNDRY_PROJECT_ENDPOINT: ${{ needs.validate-infra.outputs.foundry_project_endpoint }}
      run: |
        set -euo pipefail
        echo "Deploying image: $IMAGE_REF"

        # Modify azure.yaml to use pre-built image for container deploy.
        # Keep the heredoc body indented so this workflow stays valid YAML
        # (column-0 lines break parsing and hide workflow_dispatch on the branch).
        cp azure.yaml azure.yaml.bak
        pip install pyyaml -q 2>/dev/null || true
        python3 <<'EOF'
        import os
        import yaml

        with open('azure.yaml', 'r') as f:
            data = yaml.safe_load(f)

        svc = data['services']['storage-kv-agent']
        svc['language'] = 'docker'
        svc['image'] = os.environ['IMAGE_REF']
        for key in ['project', 'codeConfiguration', 'docker']:
            svc.pop(key, None)

        with open('azure.yaml', 'w') as f:
            yaml.dump(data, f, sort_keys=False)
        EOF

        # Deploy using azd deploy which will use the image from azure.yaml
        azd deploy storage-kv-agent -e "$AZURE_ENV_NAME" --no-prompt --output json

    - name: Grant agent identity Storage and Key Vault access
      if: github.event.inputs.skip-deploy == 'false' && steps.deploy-agent.outcome == 'success'
      env:
        FOUNDRY_PROJECT_ENDPOINT: ${{ needs.validate-infra.outputs.foundry_project_endpoint }}
      run: |
        set -euo pipefail
        ENVIRONMENT="${{ env.LAB_ENVIRONMENT }}"
        RG_NAME="rg-hosted-agents-${ENVIRONMENT}-${{ env.LOCATION_SHORT }}"
        STORAGE_ACCOUNT_NAME="sthostedagents${ENVIRONMENT}${{ env.LOCATION_SHORT }}"
        KEY_VAULT_NAME="kv-hosted-agents-${ENVIRONMENT}-${{ env.LOCATION_SHORT }}"
        AGENT_NAME="${{ env.AGENT_NAME }}"
        API_VERSION="v1"

        echo "Looking up agent instance identity for $AGENT_NAME"
        AGENT_IDENTITY=$(az rest --method GET \
          --url "${FOUNDRY_PROJECT_ENDPOINT}/agents/${AGENT_NAME}?api-version=${API_VERSION}" \
          --resource "https://ai.azure.com" \
          --query "instance_identity.principal_id" \
          --output tsv)

        if [ -z "$AGENT_IDENTITY" ] || [ "$AGENT_IDENTITY" = "None" ]; then
          echo "::error::Could not resolve instance_identity.principal_id for agent '$AGENT_NAME'."
          exit 1
        fi

        echo "Agent identity principal ID: $AGENT_IDENTITY"

        STORAGE_ID=$(az storage account show \
          --name "$STORAGE_ACCOUNT_NAME" \
          --resource-group "$RG_NAME" \
          --query id -o tsv)
        KV_ID=$(az keyvault show \
          --name "$KEY_VAULT_NAME" \
          --resource-group "$RG_NAME" \
          --query id -o tsv)

        assign_if_missing() {
          local role="$1"
          local scope="$2"
          if az role assignment list \
            --assignee-object-id "$AGENT_IDENTITY" \
            --scope "$scope" \
            --role "$role" \
            --query '[0].id' -o tsv | grep -q .; then
            echo "Already assigned: $role on $scope"
            return 0
          fi
          echo "Assigning: $role"
          az role assignment create \
            --assignee-object-id "$AGENT_IDENTITY" \
            --assignee-principal-type ServicePrincipal \
            --role "$role" \
            --scope "$scope" \
            --output none
        }

        assign_if_missing "Storage Blob Data Contributor" "$STORAGE_ID"
        assign_if_missing "Key Vault Secrets User" "$KV_ID"

        echo "Agent identity RBAC grants complete."
