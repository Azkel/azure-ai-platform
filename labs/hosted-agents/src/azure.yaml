# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    extensions:
        azure.ai.agents: '>=1.0.0-beta.4'
name: storage-kv-agent
services:
    ai-project:
        host: azure.ai.project
        deployments:
            - model:
                format: OpenAI
                name: gpt-5-mini
                version: "2025-08-07"
              name: gpt-5-mini
              sku:
                capacity: 10
                name: GlobalStandard
    storage-kv-agent:
        project: storage-kv-agent
        host: azure.ai.agent
        language: csharp
        uses:
            - ai-project
        codeConfiguration:
            entryPoint: StorageKvAgent.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: BYO Responses agent that calls a Foundry model, reads a user-provided Key Vault secret, and persists turn notes to Azure Storage via managed identity.
        displayName: Storage + Key Vault (.NET Responses)
        environmentVariables:
            - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
              value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            - name: AZURE_STORAGE_ACCOUNT_NAME
              value: ${AZURE_STORAGE_ACCOUNT_NAME}
            - name: AZURE_STORAGE_CONTAINER_NAME
              value: ${AZURE_STORAGE_CONTAINER_NAME}
            - name: AZURE_KEY_VAULT_URI
              value: ${AZURE_KEY_VAULT_URI}
            - name: AZURE_KEY_VAULT_SECRET_NAME
              value: ${AZURE_KEY_VAULT_SECRET_NAME}
        kind: hosted
        metadata:
            tags:
                - AI Agent Hosting
                - Responses Protocol
                - Bring Your Own
                - Managed Identity
                - Azure Storage
                - Key Vault
                - .NET
        name: storage-kv-agent
        protocols:
            - protocol: responses
              version: 2.0.0
infra:
    provider: microsoft.foundry
